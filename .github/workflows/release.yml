name: Release Timich MCP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version. Use 0.1.0 or v0.1.0.
        required: true
        type: string
      draft:
        description: Create or keep the GitHub Release as a draft.
        required: true
        type: boolean
        default: true
      publish_homebrew:
        description: Update the Homebrew tap for this version. Requires draft=false.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  HOMEBREW_TAP_OWNER: ${{ github.repository_owner }}
  HOMEBREW_TAP_REPO: homebrew-timich
  HOMEBREW_FORMULA_PATH: Formula/timich-mcp.rb

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: ${{ github.event_name == 'push' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Verify
        run: scripts/ci/verify.sh

      - name: Resolve release inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PUBLISH_HOMEBREW: ${{ inputs.publish_homebrew }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            raw_version="$REF_NAME"
            draft="false"
            publish_homebrew="false"
          else
            raw_version="$INPUT_VERSION"
            draft="$INPUT_DRAFT"
            publish_homebrew="$INPUT_PUBLISH_HOMEBREW"
          fi

          version="${raw_version#v}"
          if ! [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::stable release version must look like 0.1.0 or v0.1.0"
            exit 1
          fi

          if [ "$publish_homebrew" = "true" ] && [ "$draft" = "true" ]; then
            echo "::error::publish_homebrew requires draft=false because Homebrew must download public release assets"
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "draft=$draft"
            echo "publish_homebrew=$publish_homebrew"
          } >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          for platform in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64 \
            windows/amd64
          do
            make dist \
              TIMICH_MCP_VERSION="${{ steps.release.outputs.version }}" \
              DIST_OS="${platform%/*}" \
              DIST_ARCH="${platform#*/}"
          done

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Timich MCP ${{ steps.release.outputs.version }} release artifacts.

          Artifacts:
          - Linux amd64, Linux arm64, macOS amd64, macOS arm64, and Windows amd64 bundles
          - SHA256 checksum files for each bundle
          NOTES

      - name: Validate Homebrew publish configuration
        if: ${{ steps.release.outputs.publish_homebrew == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TIMICH_HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ env.HOMEBREW_TAP_OWNER }}/${{ env.HOMEBREW_TAP_REPO }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set repository secret TIMICH_HOMEBREW_TAP_TOKEN before publishing Homebrew."
            exit 1
          fi

          gh repo view "$TAP_REPO" --json defaultBranchRef >/dev/null

      - name: Checkout Homebrew tap
        if: ${{ steps.release.outputs.publish_homebrew == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_OWNER }}/${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.TIMICH_HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: Timich MCP ${{ steps.release.outputs.version }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_args=(
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
            --target "$RELEASE_TARGET"
          )
          release_edit_args=(
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
            --draft="$RELEASE_DRAFT"
            --prerelease=false
          )
          if [ "$RELEASE_DRAFT" = "true" ]; then
            release_args+=(--draft)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_edit_args[@]}"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${release_args[@]}"
          fi

      - name: Update Homebrew formula
        if: ${{ steps.release.outputs.publish_homebrew == 'true' }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
          FORMULA_PATH: ${{ env.HOMEBREW_FORMULA_PATH }}
        run: |
          set -euo pipefail

          checksum() {
            local os="$1"
            local arch="$2"
            awk '{print $1}' "dist/timich-mcp_${VERSION}_${os}_${arch}.tar.gz.sha256"
          }

          darwin_amd64_sha="$(checksum darwin amd64)"
          darwin_arm64_sha="$(checksum darwin arm64)"
          linux_amd64_sha="$(checksum linux amd64)"
          linux_arm64_sha="$(checksum linux arm64)"

          formula_file="homebrew-tap/$FORMULA_PATH"
          mkdir -p "$(dirname "$formula_file")"

          cat > "$formula_file" <<FORMULA
          class TimichMcp < Formula
            desc "Local stdio MCP server for Timich Agent photo and video search"
            homepage "https://github.com/${RELEASE_REPO}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${RELEASE_REPO}/releases/download/${TAG}/timich-mcp_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              else
                url "https://github.com/${RELEASE_REPO}/releases/download/${TAG}/timich-mcp_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${RELEASE_REPO}/releases/download/${TAG}/timich-mcp_${VERSION}_linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              else
                url "https://github.com/${RELEASE_REPO}/releases/download/${TAG}/timich-mcp_${VERSION}_linux_amd64.tar.gz"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              binary = Dir["timich-mcp*/timich-mcp"].first || "timich-mcp"
              bin.install binary => "timich-mcp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/timich-mcp version")
            end
          end
          FORMULA

          ruby -c "$formula_file"

      - name: Create Homebrew formula pull request
        if: ${{ steps.release.outputs.publish_homebrew == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TIMICH_HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ env.HOMEBREW_TAP_OWNER }}/${{ env.HOMEBREW_TAP_REPO }}
          FORMULA_PATH: ${{ env.HOMEBREW_FORMULA_PATH }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          branch_name="release/timich-mcp-${VERSION}"
          title="Update timich-mcp to ${VERSION}"
          actor_login="$(gh api user --jq .login)"
          actor_id="$(gh api user --jq .id)"
          git -C homebrew-tap config user.name "$actor_login"
          git -C homebrew-tap config user.email "${actor_id}+${actor_login}@users.noreply.github.com"

          if [ -z "$(git -C homebrew-tap status --porcelain -- "$FORMULA_PATH")" ]; then
            echo "Homebrew formula already matches $VERSION."
            exit 0
          fi

          git -C homebrew-tap checkout -B "$branch_name"
          git -C homebrew-tap add "$FORMULA_PATH"
          git -C homebrew-tap commit -m "$title"

          remote_ref="refs/heads/${branch_name}"
          remote_sha="$(git -C homebrew-tap ls-remote --heads origin "$branch_name" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git -C homebrew-tap fetch origin "+${remote_ref}:refs/remotes/origin/${branch_name}"
            lease_arg="--force-with-lease=${remote_ref}:${remote_sha}"
          else
            lease_arg="--force-with-lease=${remote_ref}:"
          fi
          git -C homebrew-tap push "$lease_arg" origin "HEAD:${remote_ref}"

          body_file="$RUNNER_TEMP/timich-mcp-homebrew-pr.md"
          cat > "$body_file" <<BODY
          ## Summary
          Updates the Homebrew formula for timich-mcp ${VERSION}.

          ## Source
          - Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}
          - Formula path: \`${FORMULA_PATH}\`

          ## Notes
          - Checksums are generated from the release artifacts built in the release workflow.
          - Merge this PR to publish the Homebrew update.
          BODY

          base_branch="$(gh repo view "$TAP_REPO" --json defaultBranchRef --jq .defaultBranchRef.name)"
          open_pr_url="$(gh pr list \
            --repo "$TAP_REPO" \
            --state open \
            --head "$branch_name" \
            --json url \
            --jq '.[0].url // ""')"

          if [ -n "$open_pr_url" ]; then
            gh pr edit "$open_pr_url" \
              --repo "$TAP_REPO" \
              --title "$title" \
              --body-file "$body_file"
            pr_url="$open_pr_url"
          else
            pr_url="$(gh pr create \
              --repo "$TAP_REPO" \
              --head "$branch_name" \
              --base "$base_branch" \
              --title "$title" \
              --body-file "$body_file")"
          fi

          echo "Homebrew formula PR: $pr_url"
